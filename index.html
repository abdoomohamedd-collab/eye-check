

<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EyeCheck | نظام قياسات النظارات</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;background:#f1f5f9;color:#172554;

 font-family:Arial,sans-serif;

}

header{

 background:#123b69;color:white;padding:22px;

 text-align:center;

}

header h1{margin:0;font-size:30px}

header p{margin:8px 0 0;color:#cde5ff}

main{max-width:900px;margin:25px auto;padding:15px}

.card{

 background:white;padding:20px;border-radius:16px;

 margin-bottom:18px;box-shadow:0 3px 15px #0000000c;

}

h2{font-size:19px;margin-top:0}

button{

 border:0;border-radius:10px;padding:13px 18px;

 background:#1265b3;color:white;font-size:15px;

 cursor:pointer;margin:5px;

}

button.secondary{background:#475569}

button:disabled{opacity:.5}

video,img{

 width:100%;max-height:420px;object-fit:contain;

 background:#0f172a;border-radius:12px;

}

input{

 width:100%;padding:13px;border:1px solid #cbd5e1;

 border-radius:9px;margin:7px 0 15px;font-size:16px;

}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.result{

 background:#eff6ff;padding:14px;border-radius:10px;

 margin-top:10px;

}

small{color:#64748b}

footer{text-align:center;padding:25px;color:#64748b}

@media(max-width:600px){

 .grid{grid-template-columns:1fr}

}

</style>

</head>

<body>

<header>

 <h1>👁 EyeCheck</h1>

 <p>منصة مساعدة لقياسات النظارات الطبية</p>

</header>

<main>

 <section class="card">

  <h2>بيانات العميل</h2>

  <label>اسم العميل</label>

  <input id="client" placeholder="اكتب اسم العميل">

  <label>رقم الملف (اختياري)</label>

  <input id="file" placeholder="رقم الملف">

 </section>

 <section class="card">

  <h2>📷 كاميرا الفحص</h2>

  <video id="camera" autoplay playsinline muted></video>

  <div>

   <button onclick="startCamera()">تشغيل الكاميرا</button>

   <button class="secondary" onclick="stopCamera()">إيقاف الكاميرا</button>

   <button onclick="capture()">التقاط صورة</button>

  </div>

  <small>يتطلب السماح باستخدام الكاميرا. لا تُرسل الصورة لأي خادم.</small>

  <canvas id="canvas" hidden></canvas>

  <img id="photo" alt="الصورة الملتقطة" hidden>

  <p id="cameraStatus">الكاميرا متوقفة</p>

 </section>

 <section class="card">

  <h2>📏 قياسات النظارة</h2>

  <div class="grid">

   <div>

    <label>PD الكلي (mm)</label>

    <input type="number" id="pd" step="0.1" placeholder="لم يتم القياس">

   </div>

   <div>

    <label>PD العين اليمنى (mm)</label>

    <input type="number" id="rpd" step="0.1">

   </div>

   <div>

    <label>PD العين اليسرى (mm)</label>

    <input type="number" id="lpd" step="0.1">

   </div>

   <div>

    <label>عرض الفريم (mm)</label>

    <input type="number" id="frame" step="0.1">

   </div>

  </div>

  <div class="result">

   <strong>تنبيه:</strong>

   القياسات هنا إدخال يدوي فقط، وليست ناتجة عن تحليل الكاميرا حتى الآن.

  </div>

 </section>

 <section class="card">

  <h2>📝 نتيجة الفحص</h2>

  <label>ملاحظات الأخصائي</label>

  <input id="notes" placeholder="أضف الملاحظات">

  <button onclick="printReport()">طباعة التقرير</button>

  <button class="secondary" onclick="clearForm()">مسح البيانات</button>

 </section>

</main>

<footer>EyeCheck © 2026</footer>

<script>

let stream=null;

async function startCamera(){

 try{

  stopCamera();

  stream=await navigator.mediaDevices.getUserMedia({

   video:{facingMode:"user"},audio:false

  });

  document.getElementById("camera").srcObject=stream;

  document.getElementById("cameraStatus").textContent="الكاميرا تعمل";

 }catch(e){

  document.getElementById("cameraStatus").textContent=

   "تعذر تشغيل الكاميرا. تحقق من الصلاحيات والاتصال الآمن.";

 }

}

function stopCamera(){

 if(stream) stream.getTracks().forEach(t=>t.stop());

 stream=null;

 document.getElementById("camera").srcObject=null;

 document.getElementById("cameraStatus").textContent="الكاميرا متوقفة";

}

function capture(){

 const video=document.getElementById("camera");

 if(!stream || !video.videoWidth){

  alert("شغّل الكاميرا أولاً");

  return;

 }

 const canvas=document.getElementById("canvas");

 canvas.width=video.videoWidth;

 canvas.height=video.videoHeight;

 canvas.getContext("2d").drawImage(video,0,0);

 const photo=document.getElementById("photo");

 photo.src=canvas.toDataURL("image/jpeg",0.9);

 photo.hidden=false;

}

function printReport(){

 const fields=["client","file","pd","rpd","lpd","frame","notes"];

 let report="EyeCheck - تقرير قياسات\n\n";

 fields.forEach(id=>{

  const el=document.getElementById(id);

  report+=el.previousElementSibling.textContent+": "+el.value+"\n";

 });

 const w=window.open("","_blank");

 if(!w){alert("اسمح بالنوافذ المنبثقة للطباعة");return;}

 w.document.write("<pre dir='rtl' style='font:18px Arial;white-space:pre-wrap'>"+

  report.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+

  "</pre>");

 w.document.close();

 w.print();

}

function clearForm(){

 if(confirm("هل تريد مسح جميع البيانات؟")){

  document.querySelectorAll("input").forEach(x=>x.value="");

  document.getElementById("photo").hidden=true;

 }

}

</script>

</body>

</html>
